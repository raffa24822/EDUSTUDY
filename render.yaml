services:
  - type: web
    name: edustudy-portal
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: edustudy-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: JWT_SECRET
        generateValue: true
      - key: TEACHER_USERNAME
        sync: false
      - key: TEACHER_PASSWORD_HASH
        sync: false
